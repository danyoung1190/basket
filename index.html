/* Refresh: mostly reassurance, since changes arrive live. Confirms the server copy and flushes anything queued. */
let refreshing = false;
async function refreshShared(){
  if (!sharedShops().length || refreshing) return;
  refreshing = true; renderSyncState();
  try {
    await loadFirebase();
    sharedShops().forEach(subscribe);
    await Promise.all(sharedShops().map(s => fb.fs.getDocsFromServer(fb.fs.collection(fb.db, 'lists', s.shared.listId, 'items'))));
    await fb.fs.waitForPendingWrites(fb.db);
    toast('Up to date');
  } catch(e) {
    toast(fbErrorText(e).startsWith('No signal') ? "No signal. Changes will send when you're back online." : fbErrorText(e));
  }
  refreshing = false; renderSyncState();
}
function syncStatusText(shop){
  const L = live.get(shop.shared.listId);
  if (sharingError) return fbErrorText(sharingError).startsWith('No signal') ? 'Offline, showing last copy' : 'Sharing needs attention, see Settings';
  if (refreshing) return 'Checking';
  if (!L || !L.ready) return 'Connecting';
  if (L.error) return 'Sharing needs attention, see Settings';
  if (L.missing) return 'This list was deleted';
  if (L.pending) return 'Changes waiting to send';
  if (L.fromCache) return 'Offline, showing last copy';
  return 'Live';
}

const ptr = $('#ptr');
let pull = null;
main.addEventListener('touchstart', e => {
  if (!sharedShops().length || sheetCtx || drag || window.scrollY > 0 || e.touches.length !== 1) { pull = null; return; }
  pull = { y0:e.touches[0].clientY, dy:0 };
}, { passive:true });
main.addEventListener('touchmove', e => {
  if (!pull) return;
  pull.dy = e.touches[0].clientY - pull.y0;
  if (pull.dy < 10 || window.scrollY > 0) { ptr.classList.remove('show', 'ready'); return; }
  ptr.classList.add('show'); ptr.classList.toggle('ready', pull.dy > 80);

/* Create, join, leave */
async function createSharedList(name){
  await loadFirebase();
  const used = new Set(state.shops.map(s => s.color));
  const color = PALETTE.find(c => !used.has(c)) || PALETTE[state.shops.length % PALETTE.length];
  const listId = newListId();
  const shop = { id:uid(), name, color, sections:[], shared:{ fb:true, listId, joinedAt:Date.now() } };
  await fb.fs.setDoc(listRef(listId), Object.assign(metaOf(shop), { createdAt:Date.now(), updatedAt:Date.now() }));
  state.shops.push(shop);
  state.tab = shop.id;
  subscribe(shop);
  save(); render();
  return shop;
}
async function joinSharedList(code){
  const listId = parseCode(code);
  if (!listId) throw new Error('That is not a Virtual Trolley sharing code. It looks like TRLY-XXXX-XXXX-XXXX-XXXX.');
  const existing = state.shops.find(s => isShared(s) && s.shared.listId === listId);
  if (existing) { state.tab = existing.id; save(); render(); return { shop:existing, already:true }; }
  await loadFirebase();
  const snap = await fb.fs.getDocFromServer(listRef(listId));
  if (!snap.exists()) throw new Error('No list has that code. Check it and try again.');
  const v = snap.data() || {};
  const shop = { id:uid(), name:String(v.name || 'Shared list').slice(0, 80), color:v.color || PALETTE[0],
    sections:Array.isArray(v.sections) ? v.sections : [], noAisles:!!v.noAisles,
    skipAisles:Array.isArray(v.skipAisles) ? v.skipAisles : [], shared:{ fb:true, listId, joinedAt:Date.now() } };
  state.shops.push(shop);
  state.tab = shop.id;
  subscribe(shop);
  save(); render();
  return { shop, already:false };
}
function leaveSharedList(id){
  const shop = shopById(id); if (!isShared(shop)) return;
  snapshot();
  unsubscribe(shop.shared.listId);
  state.items = state.items.filter(i => i.shopId !== id);
  state.shops = state.shops.filter(s => s.id !== id);
  if (state.tab === id) state.tab = 'list';
  save(); render();
  toast(`Left ${shop.name}. The list still exists for everyone else.`, true);
}

/* In-app QR scanner, so codes never have to go through Safari. */
let scan = null, jsqrLoading = null;
function loadJsQR(){
  if (window.jsQR) return Promise.resolve();
  if (jsqrLoading) return jsqrLoading;
  jsqrLoading = new Promise((resolve, reject) => {
    const s = document.createElement('script'); s.src = 'jsqr.js';
    s.onload = () => resolve(); s.onerror = () => { jsqrLoading = null; reject(new Error('scanner')); };
    document.head.appendChild(s);
  });
  return jsqrLoading;
}
function stopScan(){
  if (!scan) return;
  const sc = scan; scan = null;
  cancelAnimationFrame(sc.raf);
  if (sc.stream) sc.stream.getTracks().forEach(t => t.stop());
}
async function startScan(){
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { toast("This phone can't scan here. Use Paste a code instead."); return; }
  openSheet(
    '<h2>Scan their code</h2>'
    + '<p class="sub">Point the camera at the QR code on their phone.</p>'
    + '<div class="scanbox"><video playsinline muted autoplay></video><div class="frame"></div><p>Looking for a code</p></div>'
    + '<div class="sheet-actions"><button type="button" class="btn" data-act="scanStop">Cancel</button></div>',
    { type:'scan' }
  );
  const me = scan = { stream:null, raf:0, last:0 };
  try {
    const [stream] = await Promise.all([
      navigator.mediaDevices.getUserMedia({ video:{ facingMode:'environment', width:{ ideal:1280 }, height:{ ideal:720 } }, audio:false }),
      loadJsQR()
    ]);
    if (scan !== me) { stream.getTracks().forEach(t => t.stop()); return; }
    me.stream = stream;
    const video = sheet.querySelector('.scanbox video');
    video.srcObject = stream;
    await video.play().catch(() => {});
    const canvas = document.createElement('canvas');
    const g = canvas.getContext('2d', { willReadFrequently:true });
    const tick = t => {
      if (scan !== me) return;
      me.raf = requestAnimationFrame(tick);
      if (t - me.last < 120 || !video.videoWidth) return;
      me.last = t;
      const w = 640, h = Math.round(video.videoHeight * (w / video.videoWidth));
      canvas.width = w; canvas.height = h;
      g.drawImage(video, 0, 0, w, h);
      const hit = window.jsQR(g.getImageData(0, 0, w, h).data, w, h, { inversionAttempts:'dontInvert' });
      if (!hit || !hit.data) return;
      const id = parseCode(hit.data);
      if (!id) { sheet.querySelector('.scanbox p').textContent = "That isn't a Virtual Trolley code"; return; }
      stopScan();
      if (navigator.vibrate) navigator.vibrate(30);
      sheet.querySelector('.scanbox p').textContent = 'Joining';
      joinWith(id, false).then(ok => { if (!ok) openJoinShared(id); });
    };
    me.raf = requestAnimationFrame(tick);
  } catch(e) {
    stopScan();
    const denied = e && (e.name === 'NotAllowedError' || e.name === 'SecurityError');
    openJoinShared('');
    toast(denied ? 'Camera access was blocked. Allow it when asked, or use Paste a code.' : (e && e.message === 'scanner' ? 'The scanner needs signal the first time. Use Paste a code.' : "Couldn't start the camera. Use Paste a code."));
  }
}

  const gw = Math.min(W, 460), ox = Math.round((W - gw) / 2);
  const g = { W, gw, ox, backL:62, backR:gw - 22, frontL:70, frontR:gw - 30, botL:86, botR:gw - 58, inL:92, inR:gw - 64 };
  ['backL','backR','frontL','frontR','botL','botR','inL','inR'].forEach(k => g[k] += ox);
  return g;
}
// Where each package stands: spread along the basket floor; a second row stands behind, half a step along.
function goodSlot(i, W){
  const g = trolleyGeom(W), step = 40;
  const perRow = Math.max(4, Math.floor((g.inR - g.inL) / step));
  const row = Math.floor(i / perRow) % 2;
  return { x: g.inL + 24 + (i % perRow) * step + (row ? step / 2 : 0), back: row === 1 };

const BY_NAME_RE = BY_NAME.map(([k, f, c, x]) => [new RegExp('(^|\\s)(' + k + ')', 'i'), f, c, x]);
function produceSvg(name, x, y, s, edge){ return D.generic_fruit(x, y, '#6DBE5A', undefined, s); }

function packageSvg(it, x, newId){
  const cat = categoryFor(it.name), shape = SHAPES[cat] || 'box', s = seedOf(it.id);
  const col = GOOD_COLOURS[cat] || '#F5A524', y = FLOOR, f = fold(it.name);
  let d = '';
  for (const [re, fn, c, extra] of BY_NAME_RE) { if (re.test(f)) { d = fn(x, y, c || col, extra, s); break; } }
  if (!d) switch (shape) {
    case 'fruit': d = D.generic_fruit(x, y, col, undefined, s); break;
    case 'bread': d = s % 2 ? D.baguette(x, y, col, undefined, s) : D.loaf(x, y, col); break;
    case 'carton': d = s % 3 === 0 ? D.eggbox(x, y) : D.carton(x, y, ['#5BA4D9','#D6544F','#6DBE5A'][s % 3]); break;
    case 'wine': d = D.wine(x, y, col); break;
    case 'bottle': d = D.bottle(x, y, col); break;
    case 'spray': d = D.spray(x, y, col); break;
    case 'pump': d = D.pump(x, y, col); break;
    case 'tin': d = D.tin(x, y, col); break;
    case 'jar': d = D.jar(x, y, col); break;
    case 'spice': d = D.spice(x, y, ['#B5562E','#D6544F','#6E8B3D','#E0A857','#8B4A2E'][s % 5]); break;
    case 'crisps': d = D.crisps(x, y, col); break;
    case 'bag': d = D.bag(x, y, col); break;
    case 'tray': d = D.tray(x, y, col); break;
    case 'tub': d = D.tub(x, y, col); break;
    case 'block': d = D.wedge(x, y, col); break;
    default: d = D.box(x, y, col, 34 + s % 12);
  }
  // Goods are scaled up around the point they stand on.
  return `<g class="good${it.id === newId ? ' landing' : ''}" data-id="${esc(it.id)}"><g transform="translate(${x} ${y}) scale(${GOOD_SCALE}) translate(${-x} ${-y})">${d}</g></g>`;
}

  let p = '';

  for (let k = 1; k <= 2; k++) { const t = k / 3, y = top + (FLOOR - top) * t;
    p += `M${(l + (bl - l) * t).toFixed(1)} ${y.toFixed(1)} L${(r + (br - r) * t).toFixed(1)} ${y.toFixed(1)}`; }

}

function renderTrolley(newId){
  const show = tabItems().length > 0;
  dock.hidden = !show;
  document.body.classList.toggle('with-dock', show);
  layer.classList.toggle('with-trolley', show);
  if (!show) return;
  const n = trolleyItems().length;
  dock.querySelector('.tcount').textContent = n ? String(n) : '';
  dock.querySelector('.hint').textContent = n ? 'in trolley' : 'Trolley';
  dock.querySelector('.hit').setAttribute('aria-label', n ? `Your trolley has ${n} ${n === 1 ? 'item' : 'items'}. Open it` : 'Your trolley is empty');
  drawTrolley(newId);

function bumpTrolley(){
  const roll = dock.querySelector('.roll');
  if (!roll || !roll.animate || window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

  roll.animate([{ transform:'none' }, { transform:'translate(0, 3px)', offset:.25 }, { transform:'translate(7px, 0)', offset:.6 }, { transform:'none' }], { duration:520, easing:'ease-out' });
  roll.querySelectorAll('.wheel').forEach(w => w.animate([{ transform:'rotate(0)' }, { transform:'rotate(150deg)', offset:.6 }, { transform:'rotate(0)' }], { duration:520, easing:'ease-out' }));
  const c = dock.querySelector('.tcount');
  if (c.animate) c.animate([{ transform:'scale(1)' }, { transform:'scale(1.35)' }, { transform:'scale(1)' }], { duration:300 });
}
function flyToTrolley(row, item){

  const from = row.querySelector('.name').getBoundingClientRect();
  const tsvg = dock.querySelector('svg.trolley').getBoundingClientRect();
  const pill = document.createElement('div');
  pill.className = 'flyer';
  pill.textContent = item.name + qtyLabel(item.qty);
  pill.style.left = from.left + 'px';
  pill.style.top = (from.top + from.height / 2 - 18) + 'px';
  document.body.appendChild(pill);
  const p = pill.getBoundingClientRect();
  // Aim at the spot along the rim where this item's package will stand.
  const scale = tsvg.height / TH;
  const tx = tsvg.left + goodSlot(trolleyItems().length + flying.size, tsvg.width / scale).x * scale;
  const ty = tsvg.top + (RIM - 14) * scale;

    { transform:'translate(0, 0) scale(1) rotate(0)', opacity:1, easing:'cubic-bezier(.2, .7, .4, 1)' },
    { transform:`translate(${dx * .15}px, -28px) scale(1.04) rotate(-4deg)`, opacity:1, offset:.22, easing:'cubic-bezier(.55, 0, .9, .45)' },
    { transform:`translate(${dx}px, ${dy}px) scale(.32) rotate(${dx > 0 ? 14 : -14}deg)`, opacity:.95, offset:.92 },
    { transform:`translate(${dx}px, ${dy + 10}px) scale(.2) rotate(${dx > 0 ? 16 : -16}deg)`, opacity:0 }
  ], { duration:Math.min(900, 520 + Math.abs(dy) * .35), fill:'forwards' }).finished.then(finish, finish);
}

/* Swipe up (or tap) to look inside */
let dockDrag = null;
const basketEl = dock.querySelector('.hit');
basketEl.addEventListener('pointerdown', e => { dockDrag = { y0:e.clientY, dy:0 }; dock.classList.add('drag'); try { basketEl.setPointerCapture(e.pointerId); } catch(_) {} });
basketEl.addEventListener('pointermove', e => {
  if (!dockDrag) return;
  dockDrag.dy = e.clientY - dockDrag.y0;
  dock.style.transform = dockDrag.dy < 0 ? `translateY(${Math.max(dockDrag.dy * .35, -24)}px)` : '';
});
const dockEnd = e => {
  if (!dockDrag) return;
  const d = dockDrag; dockDrag = null;
  dock.classList.remove('drag'); dock.style.transform = '';
  if (e.type === 'pointercancel') return;
  if (d.dy < -24 || Math.abs(d.dy) < 8) openTrolleySheet();
};
basketEl.addEventListener('pointerup', dockEnd);
basketEl.addEventListener('pointercancel', dockEnd);
basketEl.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openTrolleySheet(); } });

function openTrolleySheet(refresh){
  const items = trolleyItems().slice().reverse();
  const shop = currentShop();
  const html = `<h2>In your trolley${items.length ? ` (${items.length})` : ''}</h2>`
    + `<p class="sub">${items.length ? 'Tap anything you put back to return it to the list.' : 'Nothing in it yet. Tap items on your list and they drop in here.'}</p>`
    + (items.length ? `<ul class="list trolley-list" aria-label="In trolley">${items.map(i => itemRow(i, { showUsual:!shop })).join('')}</ul>`
        + '<div class="sheet-actions"><button type="button" class="btn primary" data-act="cancel">Keep shopping</button></div>'
        + '<button type="button" class="btn danger wide empty-trolley" data-act="clearTicked">Empty the trolley</button>'
      : '<div class="sheet-actions"><button type="button" class="btn" data-act="cancel">Close</button></div>');
  if (refresh && sheetCtx && sheetCtx.type === 'trolley') {
    const top = sheet.scrollTop;
    sheet.innerHTML = sheet.querySelector('.sheet-top').outerHTML + html;
    sheet.scrollTop = top;
  } else openSheet(html, { type:'trolley' });
}
// Slide a section row left to reveal Delete.
let secSwipe = null;
const closeSwipes = except => sheet.querySelectorAll('.secrow.swipe.open').forEach(r => { if (r !== except) { r.classList.remove('open'); r.querySelector('.slide').style.transform = ''; } });
sheet.addEventListener('pointerdown', e => {
  const slide = e.target.closest('.secrow.swipe .slide'); if (!slide) { if (!e.target.closest('.swipe-del')) closeSwipes(); return; }
  const row = slide.parentElement; closeSwipes(row);
  secSwipe = { row, slide, x0:e.clientX, y0:e.clientY, base:row.classList.contains('open') ? -92 : 0, dx:0, active:false };
});
sheet.addEventListener('pointermove', e => {
  const sw = secSwipe; if (!sw) return;
  const dx = e.clientX - sw.x0, dy = e.clientY - sw.y0;
  if (!sw.active) { if (Math.abs(dy) > 10 && Math.abs(dy) > Math.abs(dx)) { secSwipe = null; return; } if (Math.abs(dx) < 10) return; sw.active = true; sw.row.classList.add('dragging'); }
  sw.dx = dx;
  sw.slide.style.transform = `translateX(${Math.max(-110, Math.min(0, sw.base + dx))}px)`;
});
const endSecSwipe = () => {
  const sw = secSwipe; secSwipe = null; if (!sw || !sw.active) return;
  sw.row.classList.remove('dragging');
  const pos = sw.base + sw.dx, open = pos < -46;
  sw.row.classList.toggle('open', open);
  sw.slide.style.transform = open ? 'translateX(-92px)' : '';
  // a swipe must not also count as a tap on the buttons under the finger
  const block = ev => { ev.stopPropagation(); ev.preventDefault(); };
  sw.slide.addEventListener('click', block, { capture:true, once:true });
  setTimeout(() => sw.slide.removeEventListener('click', block, { capture:true }), 400);
};
sheet.addEventListener('pointerup', endSecSwipe);
sheet.addEventListener('pointercancel', () => { if (secSwipe) { secSwipe.row.classList.remove('dragging'); secSwipe.slide.style.transform = secSwipe.base ? 'translateX(-92px)' : ''; secSwipe = null; } });

// Tapping an item inside the trolley puts it back on the list.
sheet.addEventListener('click', e => {
  if (!sheetCtx || sheetCtx.type !== 'trolley') return;
  const row = e.target.closest('.row.item'); if (!row) return;
  toggleDone(row.dataset.id);
});

/* ---------- Moving between addresses or phones ----------
   The whole list (private shops, history, shared list links) goes up to Firestore under a one-off random code,
   and comes down on the other side. iPhone keeps each web address's storage separate, so this is the bridge. */
const NEW_HOME = 'https://list-sharing.web.app/';
const IS_OLD_HOME = /\.github\.io$/.test(location.hostname) || !!window.__TROLLEY_OLD_HOME;
const formatMove = id => 'MOVE-' + id.match(/.{1,4}/g).join('-');
function parseMoveCode(raw){
  const m = String(raw || '').toUpperCase().match(/MOVE[\s-]*((?:[A-Z0-9]{4}[\s-]*){4})/);
  if (!m) return null;
  const id = m[1].replace(/[^A-Z0-9]/g, '');
  return id.length === 16 && [...id].every(c => CODE_ALPHABET.includes(c)) ? id : null;
}
const withTimeout = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(Object.assign(new Error('timeout'), { code:'unavailable' })), ms))]);
const transferRef = id => fb.fs.doc(fb.db, 'transfers', id);

let movedHidden = false;
function renderMoved(){
  const el = $('#moved');
  if (!IS_OLD_HOME || movedHidden || !NEW_HOME) { el.innerHTML = ''; return; }
  const standalone = isStandalone();
  el.innerHTML = '<section class="install"><h2>Virtual Trolley has a new home</h2>'
    + (standalone
      ? '<p>Move your lists across in about a minute. Everything comes with you, including shared lists.</p>'
        + '<div class="row-btns"><button type="button" class="btn" data-act="movedLater">Not now</button><button type="button" class="btn primary" data-act="moveStart">Move my lists</button></div>'
      : `<p>Open <strong>${esc(NEW_HOME.replace(/^https:\/\//, '').replace(/\/$/, ''))}</strong> in Safari and add that to your Home Screen instead.</p>`
        + `<div class="row-btns"><a class="btn primary" href="${esc(NEW_HOME)}">Go to the new address</a></div>`)
    + '</section>';
}
$('#moved').addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  if (b.dataset.act === 'movedLater') { movedHidden = true; renderMoved(); }
  if (b.dataset.act === 'moveStart') startMove();
});

function startMove(){
  if (!sharingConfigured()) { toast("Moving needs sharing set up. Use Back up and Restore instead."); return; }
  const id = newListId(), code = formatMove(id);
  const upload = (async () => {
    await loadFirebase();
    const payload = JSON.stringify({ app:'trolley', v:1, data:state });
    await withTimeout(fb.fs.setDoc(transferRef(id), { data:payload, createdAt:Date.now() }), 20000);
  })();
  // Copy while the tap still counts as a tap: iPhone only lets a page copy during one.
  let copied = Promise.resolve(false);
  try {
    if (window.ClipboardItem && navigator.clipboard && navigator.clipboard.write) {
      const blob = upload.then(() => new Blob([code], { type:'text/plain' }));
      copied = navigator.clipboard.write([new ClipboardItem({ 'text/plain': blob })]).then(() => true, () => false);
    }
  } catch(e) { copied = Promise.resolve(false); }
  openSheet('<h2>Getting your lists ready</h2><p class="sub">This takes a few seconds.</p>', { type:'moving' });
  upload.then(() => copied).then(ok => openMoveReady(code, ok)).catch(e => {
    openSheet(`<h2>Couldn't move your lists</h2><p class="sub">${esc(fbErrorText(e))}</p>`
      + '<p class="note">You can also use Settings, Back up now, then Restore on the other side.</p>'
      + '<div class="sheet-actions"><button type="button" class="btn primary" data-act="moveStart">Try again</button></div>', { type:'movefail' });
  });
}
function openMoveReady(code, copied){
  const there = IS_OLD_HOME && NEW_HOME;
  openSheet(
    `<h2>${copied ? 'Code copied' : 'Your move code'}</h2>`
    + `<p class="bigcode">${esc(code)}</p>`
    + '<ol class="steps">'
    + (there ? `<li>Open <strong>${esc(NEW_HOME.replace(/^https:\/\//, '').replace(/\/$/, ''))}</strong> in Safari and add it to your Home Screen.</li>`
             : '<li>Open Virtual Trolley on the other phone.</li>')
    + '<li>Open the new Virtual Trolley and choose <strong>Moving from another phone or the old app</strong>, or Settings, then Bring lists.</li>'
    + `<li>Tap <strong>Paste</strong>.${copied ? '' : ' Copy the code first with the button below.'}</li></ol>`
    + '<p class="note">The code works once, for 7 days. Nothing is removed from this phone.</p>'
    + '<div class="sheet-actions"><button type="button" class="btn" data-act="moveCopy">Copy code</button>'
    + (there ? `<a class="btn primary" href="${esc(NEW_HOME)}">Open new address</a>` : '') + '</div>',
    { type:'moveready', code }
  );
}
function openMoveIn(){
  openSheet(
    '<h2>Bring your lists</h2><p class="sub">Paste the move code from the old app or the other phone.</p>'
    + `<div class="join-big"><button type="button" class="btn primary" data-act="movePaste" style="grid-column:1 / -1">${ICON_PASTE}Paste</button></div>`
    + '<p class="or">or type it</p><form data-form="move" autocomplete="off">'
    + '<input class="field code" name="code" placeholder="MOVE-XXXX-XXXX-XXXX-XXXX" autocapitalize="characters" autocorrect="off" spellcheck="false" aria-label="Move code">'
    + '<p class="note err" hidden></p><div class="sheet-actions"><button type="submit" class="btn">Bring them in</button></div></form>',
    { type:'movein' }
  );
}
async function pasteMove(){
  if (!sheetCtx || sheetCtx.type !== 'movein') { openMoveIn(); }
  let text = '';
  try { if (navigator.clipboard && navigator.clipboard.readText) text = await navigator.clipboard.readText(); } catch(e) { text = ''; }
  const id = parseMoveCode(text);
  if (!id) { const inp = sheet.querySelector('input.code'); if (inp) inp.focus(); if (text) moveError('No move code found. They look like MOVE-XXXX-XXXX-XXXX-XXXX.'); else toast('Hold the box below and choose Paste'); return; }
  importMove(id);
}
function moveError(msg){
  const p = sheet.querySelector('form[data-form="move"] .err');
  if (p) { p.textContent = msg; p.hidden = false; } else toast(msg);
}
async function importMove(id){
  try {
    await loadFirebase();
    const snap = await withTimeout(fb.fs.getDocFromServer(transferRef(id)), 20000);
    if (!snap.exists()) throw new Error('That move code has already been used or has expired.');
    const v = snap.data() || {};
    if (Date.now() - (v.createdAt || 0) > 7 * DAY) throw new Error('That move code has expired. Make a new one.');
    let obj = null; try { obj = JSON.parse(v.data); } catch(e) {}
    const data = obj && obj.data;
    if (!isValid(data)) throw new Error("That move code didn't contain any lists.");
    data.welcomed = true;
    const empty = !state.items.length && !state.shops.length;
    if (empty) {
      snapshot(); state = normalise(data);
      save(); resetSharing(); render(); closeSheet();
      toast('Your lists have moved in', true);
      finishMove(id);
    } else {
      openSheet('<h2>Replace what is on this phone?</h2>'
        + `<p class="note">The moved lists have ${data.items.length} items across ${data.shops.length} shops. This phone has ${state.items.length} items, which will be replaced. You can undo straight after.</p>`
        + '<div class="sheet-actions"><button type="button" class="btn" data-act="cancel">Cancel</button><button type="button" class="btn primary" data-act="confirmRestore">Replace</button></div>',
        { type:'restore', data, moved:true, moveId:id });
    }
  } catch(e) { moveError(e.message && !e.code ? e.message : fbErrorText(e)); }
}
function finishMove(id){ if (fb) fb.fs.deleteDoc(transferRef(id)).catch(() => {}); }

/* ---------- First run ---------- */
function maybeWelcome(){
  if (state.welcomed) return;
  const empty = !state.items.length && !state.shops.length && !Object.keys(state.history).length;
  if (!empty) { state.welcomed = true; save(); return; }
  if ((isIOS && !isStandalone()) || IS_OLD_HOME || sheetCtx) return; // Safari shows the install steps instead
  state.welcomed = true; save();
  const can = sharingConfigured();
  openSheet(
    '<h2>Welcome to Virtual Trolley</h2><p class="sub">A shopping list with a tab for each shop. It works with no signal, and lists can be shared with family.</p>'
    + '<div class="menu">'
    + `<button type="button" class="menu-item" data-act="welcomeShops"><span class="mi">${ICON_STORE}</span><span><strong>Pick your shops</strong><small>Each gets its own tab, sorted by aisle</small></span></button>`
    + (can ? `<button type="button" class="menu-item" data-act="menuJoin"><span class="mi">${ICON_JOIN}</span><span><strong>Join a shared list</strong><small>Someone has a list to share with you</small></span></button>`
           + `<button type="button" class="menu-item" data-act="movePaste"><span class="mi">${ICON_PASTE}</span><span><strong>Moving from another phone or the old app</strong><small>Bring everything across with a move code</small></span></button>` : '')
    + '</div><div class="sheet-actions"><button type="button" class="btn" data-act="cancel">Just start a list</button></div>',
    { type:'welcome' }
  );
}
function openShopPicker(){
  const have = new Set(state.shops.map(s => key(s.name)));
  openSheet(
    '<h2>Pick your shops</h2><p class="sub">Tap the ones you use. You can add others with + Add at any time.</p>'
    + '<div class="chips" style="margin-top:16px">'
    + SHOP_SUGGESTIONS.filter(n => !have.has(key(n))).map(n => `<button type="button" class="chip" data-act="pickShop" data-v="${esc(n)}" aria-pressed="false">${esc(n)}</button>`).join('')
    + '</div><div class="sheet-actions"><button type="button" class="btn primary" data-act="pickDone">Done</button></div>',
    { type:'picker' }
  );
}
/* ---------- Start ---------- */
// 2.1.1: aisles now appear on their own, so file anything that was left outside one. Once per private shop.
(function fileOldItems(){
  state.aislesFiled = state.aislesFiled || [];
  let changed = false;
  state.shops.forEach(sh => {
    healAisles(sh);
    if (isShared(sh) || state.aislesFiled.includes(sh.id)) return;
    fileUnplaced(sh); state.aislesFiled.push(sh.id); changed = true;
  });
  if (changed) safeSet(KEY, JSON.stringify(state));
})();
render();
(function handleJoinLink(){
  const m = location.hash.match(/#join=([^&]+)/);
  if (!m) return;
  const listId = parseCode(decodeURIComponent(m[1]));
  history.replaceState(null, '', location.pathname + location.search);
  if (!listId) return;
  if (isStandalone()) openJoinShared(listId); else openSafariJoin(listId);
})();
startSharing();
setTimeout(maybeWelcome, 300);
if (loadWarning) toast(loadWarning);
</script>
</body>
