/* ---------- Shared lists (live sync through Firebase) ----------
   A shared list is an ordinary shop with shared:{ fb:true, listId }. Its items live in state.items
   like any shop's, and are mirrored to Firestore:  lists/<listId>  (name, colour, sections)
                                                    lists/<listId>/items/<itemId>
   Local edits are written after every save(); remote edits arrive live and replace the shop's items.
   The code people type is the list id, which is random and unguessable. */
const FB_VERSION = '11.10.0';
const FB_CDN = `https://www.gstatic.com/firebasejs/${FB_VERSION}/`;
const CODE_ALPHABET = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const isShared = shop => !!(shop && shop.shared && shop.shared.fb);
const sharedShops = () => state.shops.filter(isShared);
const sharingConfigured = () => !!(window.BASKET_FIREBASE && window.BASKET_FIREBASE.apiKey && window.BASKET_FIREBASE.projectId);

function newListId(){
  const bytes = new Uint8Array(16);
  if (window.crypto && crypto.getRandomValues) crypto.getRandomValues(bytes); else for (let i = 0; i < 16; i++) bytes[i] = Math.random() * 256;
  return [...bytes].map(b => CODE_ALPHABET[b % 32]).join('');
}
const formatCode = id => 'BSKT-' + id.match(/.{1,4}/g).join('-');
function parseCode(raw){
  let s = String(raw || '');
  const m = s.match(/#join=([^&\s]+)/); if (m) s = decodeURIComponent(m[1]);
  else {
    // A whole pasted message: pick out the BSKT code inside it.
    const c = s.match(/BSKT[\s-]*([A-Z0-9]{4}[\s-]*){4}/i);
    if (c) s = c[0];
  }
  s = s.toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (s.startsWith('BSKT')) s = s.slice(4);
  s = s.replace(/O/g, '0').replace(/I/g, '1'); // forgive the usual misreads
  if (s.length !== 16 || [...s].some(c => !CODE_ALPHABET.includes(c))) return null;
  return s;
}
const joinUrl = id => `${location.origin}${location.pathname}#join=${id}`;

/* Firebase loads on demand so the app opens instantly and still works if the SDK can't be fetched. */
let fb = null, fbLoading = null;
function loadFirebase(){
  if (fb) return Promise.resolve(fb);
  if (fbLoading) return fbLoading;
  if (!sharingConfigured()) return Promise.reject(new Error('not-configured'));
  fbLoading = Promise.all([
    import(FB_CDN + 'firebase-app.js'), import(FB_CDN + 'firebase-auth.js'), import(FB_CDN + 'firebase-firestore.js')
  ]).then(async ([appM, authM, fsM]) => {
    const app = appM.initializeApp(window.BASKET_FIREBASE);
    let db;
    try {
      db = fsM.initializeFirestore(app, { localCache: fsM.persistentLocalCache({ tabManager: fsM.persistentMultipleTabManager() }) });
    } catch(e) { db = fsM.getFirestore(app); }
    const auth = authM.getAuth(app);
    await new Promise((resolve, reject) => {
      const stop = authM.onAuthStateChanged(auth, u => { if (u) { stop(); resolve(); } }, reject);
      authM.signInAnonymously(auth).catch(reject);
    });
    fb = { app, db, auth, fs:fsM };
    return fb;
  }).catch(e => { fbLoading = null; throw e; });
  return fbLoading;
}
function fbErrorText(e){
  const code = (e && e.code) || '';
  if (!e) return 'Something went wrong.';
  if (e.message === 'not-configured') return "Sharing isn't set up on this copy of Basket yet. See the README.";
  if (code.includes('permission-denied')) return 'Not allowed. Check the Firestore rules and that Anonymous sign-in is turned on.';
  if (code.includes('unavailable') || code.includes('network') || /Failed to fetch|import/i.test(e.message || '')) return 'No signal. Try again when you are online.';
  if (code.includes('operation-not-allowed')) return 'Anonymous sign-in is not turned on in Firebase.';
  return e.message || String(e);
}

/* Local <-> Firestore */
const sharedItemFields = i => ({ id:i.id, name:i.name, qty:clampQty(i.qty), sectionId:i.sectionId || null, done:!!i.done,
  doneAt:i.doneAt || null, order:i.order || 0, addedAt:i.addedAt || 0, updatedAt:i.updatedAt || 0 });
const itemSig = i => JSON.stringify(sharedItemFields(i));
const metaOf = shop => ({ name:shop.name, color:shop.color, sections:shop.sections });
const live = new Map(); // listId -> { shop, known:Map(itemId->sig), metaSig, unsubs:[], fromCache, pending, ready }
const ownDeletes = new Set();

function listRef(id){ return fb.fs.doc(fb.db, 'lists', id); }
function itemRef(id, itemId){ return fb.fs.doc(fb.db, 'lists', id, 'items', itemId); }

// Called from save(): push whatever changed on shared lists. Firestore queues it if offline.
function noteSharedChanges(){
  if (!fb) return;
  sharedShops().forEach(shop => {
    const L = live.get(shop.shared.listId); if (!L || !L.ready) return;
    const current = new Map(itemsIn(shop.id).map(i => [i.id, i]));
    current.forEach((i, id) => {
      const sig = itemSig(i);
      if (L.known.get(id) !== sig) { L.known.set(id, sig); fb.fs.setDoc(itemRef(L.id, id), sharedItemFields(i)).catch(() => {}); }
    });
    [...L.known.keys()].forEach(id => {
      if (!current.has(id)) { L.known.delete(id); ownDeletes.add(id); fb.fs.deleteDoc(itemRef(L.id, id)).catch(() => {}); }
    });
    const ms = JSON.stringify(metaOf(shop));
    if (L.metaSig !== ms) { L.metaSig = ms; fb.fs.setDoc(listRef(L.id), Object.assign(metaOf(shop), { updatedAt:Date.now() }), { merge:true }).catch(() => {}); }
  });
}
function noteLeftShared(){ /* deletions are picked up by noteSharedChanges */ }

function subscribe(shop){
  const id = shop.shared.listId;
  if (live.has(id)) return;
  const L = { id, shop, known:new Map(), metaSig:null, unsubs:[], fromCache:true, pending:false, ready:false, missing:false };
  live.set(id, L);
  L.unsubs.push(fb.fs.onSnapshot(fb.fs.collection(fb.db, 'lists', id, 'items'), { includeMetadataChanges:true }, snap => {
    const s = shopById(shop.id); if (!s) return;
    L.fromCache = snap.metadata.fromCache; L.pending = snap.metadata.hasPendingWrites;
    const incoming = new Map();
    snap.forEach(d => { const v = d.data(); if (v && v.name) incoming.set(d.id, Object.assign(sharedItemFields(Object.assign({ id:d.id }, v)), { shopId:s.id })); });
    // Items the other person removed go to Recently removed, not into thin air.
    snap.docChanges().forEach(ch => {
      if (ch.type !== 'removed' || ch.doc.metadata.hasPendingWrites) return;
      if (ownDeletes.has(ch.doc.id)) { ownDeletes.delete(ch.doc.id); return; }
      const local = itemById(ch.doc.id);
      if (local) { state.removed.unshift(Object.assign({}, local, { removedAt:Date.now() })); if (state.removed.length > MAX_REMOVED) state.removed.length = MAX_REMOVED; }
    });
    // Before the first snapshot has landed, local edits made offline since the last run are kept and sent.
    if (!L.ready) {
      L.ready = true;
      itemsIn(s.id).forEach(i => { if (!incoming.has(i.id)) incoming.set(i.id, i); });
    }
    state.items = state.items.filter(i => i.shopId !== s.id).concat([...incoming.values()]);
    L.known = new Map([...incoming.entries()].map(([k, v]) => [k, itemSig(v)]));
    safeSet(KEY, JSON.stringify(state));
    render();
    noteSharedChanges();
  }, err => { L.error = err; renderSyncState(); }));
  L.unsubs.push(fb.fs.onSnapshot(listRef(id), { includeMetadataChanges:true }, snap => {
    const s = shopById(shop.id); if (!s) return;
    if (!snap.exists()) { if (!snap.metadata.fromCache) L.missing = true; renderSyncState(); return; }
    L.missing = false;
    const v = snap.data() || {};
    if (v.name) s.name = String(v.name).slice(0, 80);
    if (v.color) s.color = v.color;
    if (Array.isArray(v.sections)) s.sections = v.sections.filter(x => x && x.id && x.name);
    L.metaSig = JSON.stringify(metaOf(s));
    safeSet(KEY, JSON.stringify(state));
    render();
  }, err => { L.error = err; renderSyncState(); }));
}
function unsubscribe(id){
  const L = live.get(id); if (!L) return;
  L.unsubs.forEach(u => { try { u(); } catch(e) {} });
  live.delete(id);
}
async function startSharing(){
  if (!sharedShops().length) return;
  try { await loadFirebase(); } catch(e) { sharingError = e; renderSyncState(); return; }
  sharingError = null;
  sharedShops().forEach(subscribe);
}
let sharingError = null;

/* Refresh: mostly reassurance, since changes arrive live. Confirms the server copy and flushes anything queued. */
let refreshing = false;
async function refreshShared(){
  if (!sharedShops().length || refreshing) return;
  refreshing = true; renderSyncState();
  try {
    await loadFirebase();
    sharedShops().forEach(subscribe);
    await Promise.all(sharedShops().map(s => fb.fs.getDocsFromServer(fb.fs.collection(fb.db, 'lists', s.shared.listId, 'items'))));
    await fb.fs.waitForPendingWrites(fb.db);
    toast('Up to date');
  } catch(e) {
    toast(fbErrorText(e).startsWith('No signal') ? "No signal. Changes will send when you're back online." : fbErrorText(e));
  }
  refreshing = false; renderSyncState();
}
function syncStatusText(shop){
  const L = live.get(shop.shared.listId);
  if (sharingError) return fbErrorText(sharingError).startsWith('No signal') ? 'Offline, showing last copy' : 'Sharing needs attention, see Settings';
  if (refreshing) return 'Checking';
  if (!L || !L.ready) return 'Connecting';
  if (L.error) return 'Sharing needs attention, see Settings';
  if (L.missing) return 'This list was deleted';
  if (L.pending) return 'Changes waiting to send';
  if (L.fromCache) return 'Offline, showing last copy';
  return 'Live';
}
function renderSyncState(){
  const any = sharedShops().length > 0;
  $('#btnSync').hidden = !any;
  $('#btnSync').classList.toggle('spin', refreshing);
  if (!any) return;
  const shop = currentShop();
  if (isShared(shop)) {
    const base = $('#subtitle').textContent.split('. ')[0];
    $('#subtitle').textContent = `${base}. ${syncStatusText(shop)}`;
  }
}
const sharingWarning = () => !!sharingError && !fbErrorText(sharingError).startsWith('No signal') || [...live.values()].some(L => L.error);

$('#btnSync').addEventListener('click', refreshShared);
window.addEventListener('online', () => { if (sharingError) startSharing(); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && sharingError) startSharing(); });

/* Pull down to refresh */
const ptr = $('#ptr');
let pull = null;
main.addEventListener('touchstart', e => {
  if (!sharedShops().length || sheetCtx || drag || window.scrollY > 0 || e.touches.length !== 1) { pull = null; return; }
  pull = { y0:e.touches[0].clientY, dy:0 };
}, { passive:true });
main.addEventListener('touchmove', e => {
  if (!pull) return;
  pull.dy = e.touches[0].clientY - pull.y0;
  if (pull.dy < 10 || window.scrollY > 0) { ptr.classList.remove('show', 'ready'); return; }
  ptr.classList.add('show'); ptr.classList.toggle('ready', pull.dy > 80);
  ptr.textContent = pull.dy > 80 ? 'Release to refresh' : 'Pull to refresh';
}, { passive:true });
const endPull = () => {
  const p = pull; pull = null;
  ptr.classList.remove('show', 'ready');
  if (p && p.dy > 80 && window.scrollY <= 0) refreshShared();
};
main.addEventListener('touchend', endPull);
main.addEventListener('touchcancel', endPull);

/* Create, join, leave */
async function createSharedList(name){
  await loadFirebase();
  const used = new Set(state.shops.map(s => s.color));
  const color = PALETTE.find(c => !used.has(c)) || PALETTE[state.shops.length % PALETTE.length];
  const listId = newListId();
  const shop = { id:uid(), name, color, sections:[], shared:{ fb:true, listId, joinedAt:Date.now() } };
  await fb.fs.setDoc(listRef(listId), Object.assign(metaOf(shop), { createdAt:Date.now(), updatedAt:Date.now() }));
  state.shops.push(shop);
  state.tab = shop.id;
  subscribe(shop);
  save(); render();
  return shop;
}
async function joinSharedList(code){
  const listId = parseCode(code);
  if (!listId) throw new Error('That is not a Basket sharing code. It looks like BSKT-XXXX-XXXX-XXXX-XXXX.');
  const existing = state.shops.find(s => isShared(s) && s.shared.listId === listId);
  if (existing) { state.tab = existing.id; save(); render(); return { shop:existing, already:true }; }
  await loadFirebase();
  const snap = await fb.fs.getDocFromServer(listRef(listId));
  if (!snap.exists()) throw new Error('No list has that code. Check it and try again.');
  const v = snap.data() || {};
  const shop = { id:uid(), name:String(v.name || 'Shared list').slice(0, 80), color:v.color || PALETTE[0],
    sections:Array.isArray(v.sections) ? v.sections : [], shared:{ fb:true, listId, joinedAt:Date.now() } };
  state.shops.push(shop);
  state.tab = shop.id;
  subscribe(shop);
  save(); render();
  return { shop, already:false };
}
function leaveSharedList(id){
  const shop = shopById(id); if (!isShared(shop)) return;
  snapshot();
  unsubscribe(shop.shared.listId);
  state.items = state.items.filter(i => i.shopId !== id);
  state.shops = state.shops.filter(s => s.id !== id);
  if (state.tab === id) state.tab = 'list';
  save(); render();
  toast(`Left ${shop.name}. The list still exists for everyone else.`, true);
}

/* Sheets */
function openShareHub(){
  const lists = sharedShops();
  const rows = lists.map(s => `<div class="secrow"><span class="nm">${esc(s.name)}<small>${esc(syncStatusText(s))}</small></span>`
      + `<button type="button" class="mini text" data-act="showCode" data-shop="${esc(s.id)}">Code</button></div>`).join('');
  const problem = sharingError && !fbErrorText(sharingError).startsWith('No signal') ? `<p class="note err">${esc(fbErrorText(sharingError))}</p>` : '';
  openSheet(
    '<h2>Shared lists</h2>'
    + '<p class="sub">A shared list is a tab everyone with its code can see and edit, live. Your own shops stay private.</p>'
    + problem
    + (!sharingConfigured() ? '<p class="note err">Sharing isn\'t set up on this copy of Basket yet. The README explains the one-off setup.</p>' : '')
    + (rows ? `<h3 class="sh-label">Your shared lists</h3>${rows}` : '')
    + '<div class="sheet-actions"><button type="button" class="btn" data-act="joinStart">Join a list</button>'
    + '<button type="button" class="btn primary" data-act="createStart">Create a list</button></div>',
    { type:'share' }
  );
}
function openCreateShared(){
  openPrompt({ title:'Create a shared list', sub:'Give it a name, for example Home or Mum and Dad.', placeholder:'List name', value:'Home', button:'Create',
    onSave: async name => {
      const btn = sheet.querySelector('button[type="submit"]'); if (btn) { btn.disabled = true; btn.textContent = 'Creating'; }

      catch(e) { toast(fbErrorText(e)); openShareHub(); }
    }
  });
}

async function joinWith(raw, errorTarget){
  const id = parseCode(raw);
  const fail = msg => {
    if (errorTarget) { const f = sheet.querySelector('form[data-form="join"]'); if (f) { const p = f.querySelector('.err'); p.textContent = msg; p.hidden = false; return; } }
    toast(msg);
  };
  if (!id) { fail('No Basket code found. Codes look like BSKT-XXXX-XXXX-XXXX-XXXX.'); return false; }
  try {
    const r = await joinSharedList(id);
    closeSheet();
    toast(r.already ? `You're already in ${r.shop.name}` : `Joined ${r.shop.name}`);
    return true;
  } catch(e) { fail(fbErrorText(e)); return false; }
}
async function pasteAndJoin(){
  let text = '';
  try { if (navigator.clipboard && navigator.clipboard.readText) text = await navigator.clipboard.readText(); }
  catch(e) { text = ''; }
  if (!text) {
    const inp = sheet.querySelector('input.code');
    if (inp) inp.focus();
    toast('Hold the box below and choose Paste');
    return;
  }
  const inp = sheet.querySelector('input.code');
  const id = parseCode(text);
  if (inp && id) inp.value = formatCode(id);
  await joinWith(text, true);
}

/* In-app QR scanner, so codes never have to go through Safari. */
let scan = null, jsqrLoading = null;
function loadJsQR(){
  if (window.jsQR) return Promise.resolve();
  if (jsqrLoading) return jsqrLoading;
  jsqrLoading = new Promise((resolve, reject) => {
    const s = document.createElement('script'); s.src = 'jsqr.js';
    s.onload = () => resolve(); s.onerror = () => { jsqrLoading = null; reject(new Error('scanner')); };
    document.head.appendChild(s);
  });
  return jsqrLoading;
}
function stopScan(){
  if (!scan) return;
  const sc = scan; scan = null;
  cancelAnimationFrame(sc.raf);
  if (sc.stream) sc.stream.getTracks().forEach(t => t.stop());
}
async function startScan(){
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { toast("This phone can't scan here. Use Paste a code instead."); return; }
  openSheet(
    '<h2>Scan their code</h2>'
    + '<p class="sub">Point the camera at the QR code on their phone.</p>'
    + '<div class="scanbox"><video playsinline muted autoplay></video><div class="frame"></div><p>Looking for a code</p></div>'
    + '<div class="sheet-actions"><button type="button" class="btn" data-act="scanStop">Cancel</button></div>',
    { type:'scan' }
  );
  const me = scan = { stream:null, raf:0, last:0 };
  try {
    const [stream] = await Promise.all([
      navigator.mediaDevices.getUserMedia({ video:{ facingMode:'environment', width:{ ideal:1280 }, height:{ ideal:720 } }, audio:false }),
      loadJsQR()
    ]);
    if (scan !== me) { stream.getTracks().forEach(t => t.stop()); return; }
    me.stream = stream;
    const video = sheet.querySelector('.scanbox video');
    video.srcObject = stream;
    await video.play().catch(() => {});
    const canvas = document.createElement('canvas');
    const g = canvas.getContext('2d', { willReadFrequently:true });
    const tick = t => {
      if (scan !== me) return;
      me.raf = requestAnimationFrame(tick);
      if (t - me.last < 120 || !video.videoWidth) return;
      me.last = t;
      const w = 640, h = Math.round(video.videoHeight * (w / video.videoWidth));
      canvas.width = w; canvas.height = h;
      g.drawImage(video, 0, 0, w, h);
      const hit = window.jsQR(g.getImageData(0, 0, w, h).data, w, h, { inversionAttempts:'dontInvert' });
      if (!hit || !hit.data) return;
      const id = parseCode(hit.data);
      if (!id) { sheet.querySelector('.scanbox p').textContent = "That isn't a Basket code"; return; }
      stopScan();
      if (navigator.vibrate) navigator.vibrate(30);
      sheet.querySelector('.scanbox p').textContent = 'Joining';
      joinWith(id, false).then(ok => { if (!ok) openJoinShared(id); });
    };
    me.raf = requestAnimationFrame(tick);
  } catch(e) {
    stopScan();
    const denied = e && (e.name === 'NotAllowedError' || e.name === 'SecurityError');
    openJoinShared('');
    toast(denied ? 'Camera access was blocked. Allow it when asked, or use Paste a code.' : (e && e.message === 'scanner' ? 'The scanner needs signal the first time. Use Paste a code.' : "Couldn't start the camera. Use Paste a code."));
  }
}

function openShowCode(id){
  const shop = shopById(id); if (!isShared(shop)) return;
  const code = formatCode(shop.shared.listId);
  let svg = '';
  try {
    if (window.qrcode) { const q = qrcode(0, 'M'); q.addData(joinUrl(shop.shared.listId)); q.make(); svg = q.createSvgTag({ cellSize:4, margin:0, scalable:true }); }
  } catch(e) { svg = ''; }
  openSheet(
    `<h2>Share ${esc(shop.name)}</h2>`
    + '<p class="sub">On their phone, open Basket and tap <strong>+ Add</strong>, then <strong>Join a shared list</strong>, then <strong>Scan their code</strong>.</p>'
    + (svg ? `<div class="qr">${svg}</div>` : '')
    + `<p class="bigcode">${esc(code)}</p>`
    + '<p class="note">Anyone with this code can see and change the list, so only give it to people you want on it.</p>'
    + '<div class="sheet-actions"><button type="button" class="btn" data-act="copyCode">Copy code</button><button type="button" class="btn primary" data-act="sendCode">Send</button></div>',
    { type:'code', id, code }
  );
}
function openSafariJoin(listId){
  const code = formatCode(listId);
  openSheet(
    '<h2>You have been sent a shared list</h2>'
    + '<p class="sub">Codes are entered inside the Basket app, not in Safari.</p>'
    + '<ol class="steps"><li>Tap <strong>Copy code</strong> below.</li>'
    + '<li>Open Basket from your Home Screen. If it isn\'t there yet, add it first using the steps on this page.</li>'
    + '<li>Tap <strong>+ Add</strong>, <strong>Join a shared list</strong>, then <strong>Paste a code</strong>.</li></ol>'
    + '<p class="note">Next time, scan from inside Basket instead: + Add, Join a shared list, Scan their code.</p>'
    + `<p class="bigcode">${esc(code)}</p>`
    + '<div class="sheet-actions"><button type="button" class="btn primary" data-act="copyCode">Copy code</button></div>',
    { type:'safarijoin', code }
  );
}
function showFormError(form, msg){
  const p = form.querySelector('.err'); p.textContent = msg; p.hidden = false;
  form.querySelectorAll('button').forEach(b => b.disabled = false);
}
async function copyText(text){
  try { await navigator.clipboard.writeText(text); toast('Copied'); }
  catch(e) { toast("Couldn't copy. Write the code down instead."); }
}

/* ---------- Start ---------- */
render();
(function handleJoinLink(){
  const m = location.hash.match(/#join=([^&]+)/);
  if (!m) return;
  const listId = parseCode(decodeURIComponent(m[1]));
  history.replaceState(null, '', location.pathname + location.search);
  if (!listId) return;
  if (isStandalone()) openJoinShared(listId); else openSafariJoin(listId);
})();
startSharing();
if (loadWarning) toast(loadWarning);
</script>
